<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phage Host Prediction</title>
    <style>
        :root {
            --primary-dark: #1a1a1a;
            --secondary-dark: #2d2d2d;
            --accent-blue: #1e3d59;
            --text-light: #e0e0e0;
            --error-red: #ff6b6b;
            --border-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--primary-dark);
            color: var(--text-light);
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
        }

        .upload-section {
            background-color: var(--secondary-dark);
            padding: 2rem;
            border-radius: var(--border-radius);
            text-align: center;
        }

        .file-input-wrapper {
            border: 2px dashed var(--accent-blue);
            padding: 2rem;
            cursor: pointer;
            border-radius: var(--border-radius);
        }

        .file-input {
            display: none;
        }

        .submit-btn {
            background-color: var(--accent-blue);
            color: white;
            padding: 1rem 2rem;
            border-radius: var(--border-radius);
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 1rem;
            border: none;
        }

        .submit-btn:disabled {
            background-color: #666;
            cursor: not-allowed;
        }

        .status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: var(--border-radius);
            display: none;
        }

        .error {
            background-color: rgba(255, 0, 0, 0.1);
            color: var(--error-red);
        }

        .success {
            background-color: rgba(0, 255, 0, 0.1);
            color: #4caf50;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 1rem 0;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .results-table th,
        .results-table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #444;
        }

        .results-table th {
            background-color: var(--accent-blue);
        }

        #resultsSection {
            display: none;
            background-color: var(--secondary-dark);
            padding: 2rem;
            border-radius: var(--border-radius);
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Phage Host Prediction</h1>
            <p>Upload your CSV file for analysis</p>
        </header>

        <main>
            <section class="upload-section">
                <div class="file-input-wrapper" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" class="file-input" accept=".csv">
                    <p id="dropText">📄 Drop your CSV file here or click to browse</p>
                    <p id="fileInfo" style="margin-top: 1rem; display: none;"></p>
                </div>
                <button id="submitBtn" class="submit-btn" disabled>Analyze Data</button>
                <div id="loadingStatus" class="loading">Processing data...</div>
                <div id="errorStatus" class="status error"></div>
            </section>

            <section id="resultsSection">
                <h2>Prediction Results</h2>
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Sample</th>
                            <th>Prediction</th>
                            <th>Confidence</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody"></tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const submitBtn = document.getElementById('submitBtn');
        const loadingStatus = document.getElementById('loadingStatus');
        const errorStatus = document.getElementById('errorStatus');
        const resultsSection = document.getElementById('resultsSection');
        const resultsBody = document.getElementById('resultsBody');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                submitBtn.disabled = false;
            }
        });

        submitBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            loadingStatus.style.display = 'block';
            errorStatus.style.display = 'none';
            resultsSection.style.display = 'none';

            try {
                const response = await fetch('http://127.0.0.1:5000/predict', {
                    method: 'POST',
                    body: formData,
                });
                const data = await response.json();

                loadingStatus.style.display = 'none';
                if (data.error) {
                    errorStatus.textContent = data.error;
                    errorStatus.style.display = 'block';
                } else {
                    resultsSection.style.display = 'block';
                    resultsBody.innerHTML = data.prediction.map((pred, i) => `
                        <tr><td>Sample ${i + 1}</td><td>${pred}</td><td>${data.confidence[i] * 100}%</td></tr>
                    `).join('');
                }
            } catch {
                errorStatus.textContent = 'Server error.';
                errorStatus.style.display = 'block';
            }
        });
    </script>
</body>
</html>
