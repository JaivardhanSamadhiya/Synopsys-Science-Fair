<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phage Host Prediction</title>
    <style>
        :root {
            --primary-light: #ffffff;
            --primary-dark: #000000;
            --secondary-dark: #2d2d2d;
            --accent-blue: #1e3d59;
            --accent-green: #4caf50;
            --hover-gray: #f0f0f0;
            --text-dark: #000000;
            --text-light: #e0e0e0;
            --border-radius: 8px;
            --padding: 1.5rem;
            --margin: 2rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }

        body {
            background-color: var(--primary-light);
            color: var(--text-dark);
            font-size: 16px;
            padding: var(--margin);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            color: var(--primary-dark);
            margin-bottom: var(--margin);
        }

        .file-upload-container {
            width: 120%; /* Increased by 20% */
            max-width: 750px;
            padding: var(--padding);
            background-color: var(--secondary-dark);
            border-radius: var(--border-radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: auto; /* Reset to the original height */
        }

        input[type="file"] {
            padding: 1rem;
            background-color: var(--primary-light);
            color: var(--primary-dark);
            border: 2px solid var(--primary-dark);
            border-radius: var(--border-radius);
            width: 100%;
            cursor: pointer;
            margin-top: 1rem;
        }

        input[type="file"]:focus {
            outline: none;
        }

        button {
            padding: 1rem 2rem;
            background-color: var(--accent-blue);
            color: var(--primary-light);
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            width: 100%;
            font-size: 1.2rem;
            margin-top: 1rem;
        }

        button:hover {
            background-color: #177598;
        }

        button:disabled {
            background-color: #666;
            cursor: not-allowed;
        }

        #status {
            margin-top: 1rem;
            text-align: center;
        }

        table {
            width: 80%;  /* Adjusted width for centering */
            border-collapse: collapse;
            margin-top: 2rem;
            background-color: var(--primary-light);
            border-radius: var(--border-radius);
            display: block;
            overflow-x: auto;
            margin-left: auto;
            margin-right: auto;
            text-align: center; /* Center the text in the table */
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid #444;
        }

        th {
            background-color: var(--accent-blue);
            color: var(--primary-light);
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        td {
            color: var(--primary-dark);
        }
    </style>
</head>
<body>
    <h1>Phage Host Prediction</h1>

    <div class="file-upload-container">
        <input type="file" id="fileInput" accept=".csv">
        <button id="submitBtn">Upload & Predict</button>
    </div>

    <p id="status"></p>

    <table id="resultsTable" border="1" style="display:none;">
        <thead>
            <tr>
                <th>Sample</th>
                <th>Prediction</th>
                <th>Confidence</th>
            </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
    </table>

    <script>
        const fileInput = document.getElementById("fileInput");
        const submitBtn = document.getElementById("submitBtn");
        const statusText = document.getElementById("status");
        const resultsTable = document.getElementById("resultsTable");
        const resultsBody = document.getElementById("resultsBody");

        submitBtn.addEventListener("click", async () => {
            const file = fileInput.files[0];
            if (!file) {
                alert("Please select a file.");
                return;
            }

            console.log("📂 Selected file:", file.name);

            const formData = new FormData();
            formData.append("file", file);

            statusText.textContent = "Uploading...";
            resultsTable.style.display = "none"; // Hide previous results

            try {
                const response = await fetch("http://127.0.0.1:5000/predict", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                console.log("🔍 Server Response:", data);

                if (data.error) {
                    statusText.textContent = "Error: " + data.error;
                    return;
                }

                // Show results
                resultsBody.innerHTML = data.prediction.map((pred, i) => ` 
                    <tr>
                        <td>Sample ${i + 1}</td>
                        <td>${pred}</td>
                        <td>${(data.confidence[i] * 100).toFixed(2)}%</td>
                    </tr>
                `).join("");

                resultsTable.style.display = "block";
                statusText.textContent = "✅ Predictions Ready!";
            } catch (error) {
                console.error("❌ Fetch error:", error);
                statusText.textContent = "Server error!";
            }
        });
    </script>
</body>
</html>
