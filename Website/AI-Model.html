<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phage Host Prediction</title>
    <link rel="stylesheet" href="AI_Model.css">
</head>
<body>
    <h1>Phage Host Prediction</h1>

    <div class="file-upload-container">
        <input type="file" id="fileInput" accept=".csv">
        <button id="submitBtn">Upload & Predict</button>
    </div>

    <p id="status"></p>

    <table id="resultsTable" border="1" style="display:none;">
        <thead>
            <tr>
                <th>Sample</th>
                <th>Prediction</th>
                <th>Confidence</th>
            </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
    </table>

    <script src="AI-Model.js"></script>
</body>
</html>
