<style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh; /* Full viewport height */
      background-color: #f5f5f5; /* Optional background color */
    }
  
    #bottom {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
  
    form {
      display: flex;
      flex-direction: column;
      padding: 2vw 4vw;
      width: 90%;
      max-width: 600px;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      background: white; /* Optional: set a background for the form */
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Optional: subtle shadow for better visibility */
    }
  
    form input,
    form textarea {
      border: 0;
      margin: 10px 0;
      padding: 20px;
      outline: none;
      background: #f5f5f5;
      font-size: 16px;
      font-family: Arial, sans-serif;
      border-radius: 5px; /* Rounded corners for better aesthetics */
    }
  
    ::placeholder {
      font-family: Arial, sans-serif;
    }
  
    form button {
      padding: 15px;
      background: #ff5361;
      color: #fff;
      border: 0;
      font-size: 18px;
      outline: none;
      cursor: pointer;
      width: 150px;
      margin: 20px auto 0;
      border-radius: 30px;
      text-align: center;
      transition: background 0.3s ease; /* Smooth hover transition */
    }
  
    form button:hover {
      background: #e04a55; /* Slightly darker red for hover effect */
    }
  
    form h2 {
      margin-bottom: 20px;
      font-weight: 900;
      text-align: center;
      font-size: 55px;
      font-family: "Oswald", serif;
      font-optical-sizing: auto
    }
  </style>
  
  <div id="bottom" class="center-container">
    <form id="contactForm" action="https://formspree.io/f/mzbnpodn" method="POST">
      <h2>Contact</h2>
      <input type="text" id="name" name="name" placeholder="Your Name" required>
      <input type="email" id="email" name="email" placeholder="Email ID" required>
      <textarea id="message" name="message" rows="4" placeholder="How can we help you?" required></textarea>
      <button type="submit" id="submit">Submit</button>
    </form>
  </div>
